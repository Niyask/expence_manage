name: DailyExpense
options:
  bundleIdPrefix: com.dailyexpense
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  DailyExpense:
    type: application
    platform: iOS
    sources:
      - DailyExpense
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dailyexpense.app
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Daily Expense sends your bedtime spending summary at the time you set in Settings. Tap the notification to see today's transactions sorted by amount."
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      TARGETED_DEVICE_FAMILY: "1"
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      SWIFT_STRICT_CONCURRENCY: minimal
