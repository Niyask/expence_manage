name: DailyExpense
options:
  bundleIdPrefix: com.dailyexpense
  deploymentTarget:
    iOS: "16.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  DailyExpense:
    type: application
    platform: iOS
    sources:
      - DailyExpense
    settings:
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      PRODUCT_BUNDLE_IDENTIFIER: com.dailyexpense.app
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: Daily Expense
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Daily Expense sends your bedtime spending summary at the time you set in Settings. Tap the notification to see today's transactions sorted by amount."
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      TARGETED_DEVICE_FAMILY: "1"
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      SWIFT_STRICT_CONCURRENCY: minimal
