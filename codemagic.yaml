# Cloud build + Firebase App Distribution (for iPhone 17 / iOS 26).
# Setup: docs/FIREBASE_DISTRIBUTION.md
workflows:
  daily-expense-firebase:
    name: Daily Expense - Firebase
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.dailyexpense.app
      vars:
        XCODE_SCHEME: DailyExpense
        BUNDLE_ID: com.dailyexpense.app
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build IPA for device install
        script: |
          xcode-project build-ipa \
            --project "DailyExpense.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - niyaspulath@gmail.com
        notify:
          success: true
          failure: true
      firebase:
        firebase_token: $FIREBASE_TOKEN
        ios:
          app_id: $FIREBASE_APP_ID
          groups:
            - testers
