# Daily Expense - TestFlight (no named Codemagic integration required).
# Add 3 secrets on THIS APP in Codemagic: Environment variables (see docs/CODEMAGIC_ASC_INTEGRATION.md)
workflows:
  daily-expense-testflight:
    name: Daily Expense - TestFlight
    max_build_duration: 90

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dailyexpense.app
      vars:
        XCODE_PROJECT: DailyExpense.xcodeproj
        XCODE_SCHEME: DailyExpense
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Validate project and scheme
        script: |
          set -e
          if [ ! -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj" ]; then
            echo "ERROR: Xcode project not found."
            exit 1
          fi
          if [ ! -f "$CM_BUILD_DIR/$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme" ]; then
            echo "ERROR: Shared scheme missing."
            exit 1
          fi
          echo "OK: project and scheme found."

      - name: Install XcodeGen and sync project
        script: |
          set -e
          brew install xcodegen
          xcodegen generate

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA for TestFlight
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - niyaspulath@gmail.com
        notify:
          success: true
          failure: true
