# Daily Expense - TestFlight only.
# Set 4 secrets on app Environment variables: docs/CODEMAGIC_ASC_INTEGRATION.md
workflows:
  daily-expense-testflight:
    name: Daily Expense - TestFlight
    max_build_duration: 90

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dailyexpense.app
      vars:
        XCODE_PROJECT: DailyExpense.xcodeproj
        XCODE_SCHEME: DailyExpense
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Verify App Store Connect credentials
        script: |
          set -e
          MISSING=0
          for name in APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "ERROR: $name is empty. Add it in Codemagic -> app -> Environment variables."
              MISSING=1
            else
              echo "OK: $name is set."
            fi
          done
          KEY="${APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY:-${APP_STORE_CONNECT_PRIVATE_KEY:-}}"
          if [ -z "$KEY" ]; then
            echo "ERROR: Set APP_STORE_CONNECT_PRIVATE_KEY (and optionally APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY with same .p8 text)."
            MISSING=1
          else
            printf '%s\n' "$KEY" | sed 's/\\n/\n/g' > /tmp/asc_api_key.pem
            if openssl pkey -in /tmp/asc_api_key.pem -check -noout 2>/dev/null; then
              echo "OK: API private key is valid PEM."
            else
              echo "ERROR: API private key is not valid PEM."
              echo "Re-paste the .p8 file from Apple (include BEGIN/END lines, all line breaks)."
              MISSING=1
            fi
          fi
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Validate project and scheme
        script: |
          set -e
          if [ ! -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj" ]; then
            echo "ERROR: Xcode project not found."
            exit 1
          fi
          if [ ! -f "$CM_BUILD_DIR/$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme" ]; then
            echo "ERROR: Shared scheme missing."
            exit 1
          fi
          echo "OK: project and scheme found."

      - name: Install XcodeGen and sync project
        script: |
          set -e
          brew install xcodegen
          xcodegen generate

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA for TestFlight
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - niyaspulath@gmail.com
        notify:
          success: true
          failure: true
