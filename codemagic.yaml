# Daily Expense - Codemagic builds (works on cloud Mac; your old Xcode is not used).
#
# WORKFLOW 1 (use this now): Daily Expense - Build IPA
#   - No App Store Connect env vars needed
#   - Download .ipa from Artifacts -> upload with Transporter app to TestFlight
#
# WORKFLOW 2 (optional): Daily Expense - TestFlight
#   - Requires Codemagic integration named exactly: codemagic
#   - See docs/CODEMAGIC_ASC_INTEGRATION.md
workflows:
  daily-expense-ipa:
    name: Daily Expense - Build IPA
    max_build_duration: 90

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dailyexpense.app
      vars:
        XCODE_PROJECT: DailyExpense.xcodeproj
        XCODE_SCHEME: DailyExpense
      xcode: latest

    scripts:
      - name: Validate project and scheme
        script: |
          set -e
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          echo "OK: project and scheme found."

      - name: Install XcodeGen and sync project
        script: |
          set -e
          brew install xcodegen
          xcodegen generate

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - niyaspulath@gmail.com
        notify:
          success: true
          failure: true

  daily-expense-testflight:
    name: Daily Expense - TestFlight
    max_build_duration: 90

    integrations:
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dailyexpense.app
      vars:
        XCODE_PROJECT: DailyExpense.xcodeproj
        XCODE_SCHEME: DailyExpense
      xcode: latest

    scripts:
      - name: Validate project and scheme
        script: |
          set -e
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          echo "OK: project and scheme found."

      - name: Install XcodeGen and sync project
        script: |
          set -e
          brew install xcodegen
          xcodegen generate

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA for TestFlight
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - niyaspulath@gmail.com
        notify:
          success: true
          failure: true
